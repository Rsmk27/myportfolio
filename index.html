        <h1>Srinivasa Manikanta Rajapantula</h1>
        <p><strong>Electrical &amp; Electronics Engineering Student | Embedded Systems | Industrial Automation | IoT | Smart Energy</strong></p>

      <section>
        <h2>About</h2>
        <p>I am an Electrical and Electronics Engineering student focused on Embedded Systems, Industrial Automation (PLC, CODESYS, Factory I/O, Modbus TCP), IoT, Smart Energy Technologies, and Control Systems — turning real-world engineering problems into reliable, scalable solutions.</p>
        <p>I work at the intersection of hardware circuitry, embedded firmware, industrial automation, and smart energy systems. Web development is a supporting skill I utilize to build real-time monitoring dashboards, control interfaces, and calculation tools for engineering applications.</p>
        <p>Through industrial training at Coromandel International Limited, I built a strong foundation in power systems, electrical machines, control systems, and industrial distribution maintenance.</p>
      </section>

      <section>
        <h2>Projects</h2>

        <h3>SFMD – Sustainable Firefighter Monitoring Device</h3>
        <p>An ESP32-based wearable IoT device for firefighter safety monitoring with gas detection, fall detection, GPS tracking, and a real-time Firebase dashboard. Recognized with A-HACKS 2026 Hardware Category 2nd Place, Departmental 1st Prize, and IEI paper recognition.</p>
        <p><a href="https://sfmd.rsmk.co.in/">View Project →</a></p>

        <h3>Industrial Automation &amp; Control – CODESYS &amp; Factory I/O Simulation</h3>
        <p>PLC control logic and 3D plant simulation implementing CODESYS ladder logic, Factory I/O 3D environment, Modbus TCP communication, and HMI control screens for industrial sorting systems.</p>
        <p><a href="https://github.com/Rsmk27">View on GitHub →</a></p>

        <h3>ColorOhm – Resistor Color Code Calculator App</h3>
        <p>A precision resistor color code calculator supporting 4-band, 5-band, and SMD resistor codes. Published Android application (v1.0.0) and web utility for electronics students.</p>
        <p><a href="https://colorohm.rsmk.me/">View Project →</a></p>

        <h3>Automatic Exhaust Fan – Smart Ventilation System</h3>
        <p>An Arduino-based smart ventilation system using MQ-2 gas sensor for automatic exhaust fan control with relay switching, auto-off timer, and manual override.</p>
        <p><a href="https://autoexhaustfan.rsmk.co.in/">View Project →</a></p>

        <h3>SPDS – Solar Powered Dewatering System</h3>
        <p>A PM-KUSUM aligned solar-powered dewatering system for solar irrigation in India, eliminating grid dependency for agricultural water pumping.</p>
        <p><a href="https://spds.rsmk.me/">View Project →</a></p>

        <h3>Single-Axis Solar Tracker – Comparator Controlled System</h3>
        <p>An LDR-based single axis solar tracker built with transistor comparator relay logic that maximizes solar panel efficiency by auto-aligning with sunlight (~30% yield gain).</p>

        <h3>GridForge – Smart Energy Management System</h3>
        <p>A MATLAB-based smart grid simulation platform for industrial energy monitoring and ISO 50001 energy management compliance.</p>
        
        <h3>AgriRover – Multi-Functional ESP32 Agricultural Robot</h3>
        <p>A web-controlled IoT farming robot built on dual ESP32 microcontrollers with live video streaming, soil sensors, GPS, and an AI advisory chatbot.</p>
        <p><a href="https://github.com/Rsmk27/multi-rover">View Project on GitHub →</a></p>
      </section>
