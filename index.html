        <h1>Srinivasa Manikanta Rajapantula (RSMK)</h1>
        <p><strong>Electrical &amp; Electronics Engineering Student at ALIET | Embedded Systems | Industrial Automation | IoT | Smart Energy</strong></p>
        <p>Vijayawada, Andhra Pradesh, India — Andhra Loyola Institute of Engineering and Technology (ALIET)</p>
      </header>

      <section>
        <h2>About Srinivasa Manikanta (Manikanta Rajapantula)</h2>
        <p>I am Srinivasa Manikanta Rajapantula (often known as Srinivasa Manikanta, Manikanta, or Rajapantula), an Electrical and Electronics Engineering (EEE) student at Andhra Loyola Institute of Engineering and Technology (ALIET), Vijayawada. I specialize in Embedded Systems, Industrial Automation (PLC, CODESYS, Factory I/O, Modbus TCP), IoT (Internet of Things), Smart Energy Technologies, and Control Systems — turning real-world engineering challenges into reliable, scalable solutions.</p>
        <p>I work at the intersection of hardware circuitry, embedded firmware, industrial automation, and smart energy systems. Web development is a supporting skill I utilize to build real-time monitoring dashboards, control interfaces, and calculation tools for engineering applications.</p>
        <p>Through industrial training at Coromandel International Limited, I built a strong foundation in power systems, electrical machines, control systems, and industrial distribution maintenance.</p>
      </section>

      <section>
        <h2>Engineering Projects</h2>

        <h3>SFMD – Sustainable Firefighter Monitoring Device</h3>
        <img src="/assets/firefighter-monitoring-device.webp" alt="SFMD Sustainable Firefighter Monitoring Device ESP32 IoT Wearable — Srinivasa Manikanta Rajapantula" title="SFMD Firefighter Monitoring Device" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
        <p>An ESP32-based wearable IoT device for firefighter safety monitoring with gas detection, fall detection, GPS tracking, and a real-time Firebase dashboard. Recognized with A-HACKS 2026 Hardware Category 2nd Place, Departmental 1st Prize, and IEI paper recognition.</p>
        <p><a href="https://sfmd.rsmk.co.in/">View Project →</a></p>

        <h3>Industrial Automation &amp; Control – CODESYS &amp; Factory I/O Simulation</h3>
        <img src="/assets/gallery/ahacks/prize-ceremony.jpg" alt="Industrial Automation PLC Simulation with CODESYS and Factory I/O by Srinivasa Manikanta" title="CODESYS and Factory I/O Simulation" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
        <p>PLC control logic and 3D plant simulation implementing CODESYS ladder logic, Factory I/O 3D environment, Modbus TCP communication, and HMI control screens for industrial sorting systems.</p>
        <p><a href="https://github.com/Rsmk27">View on GitHub →</a></p>

        <h3>ColorOhm – Resistor Color Code Calculator App</h3>
        <img src="/assets/color-ohm-resistor-calculator-tool.webp" alt="ColorOhm Resistor Color Code Calculator Android App — Srinivasa Manikanta" title="ColorOhm Resistor Calculator App" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
        <p>A precision resistor color code calculator supporting 4-band, 5-band, and SMD resistor codes. Published Android application (v1.0.0) and web utility for electronics students.</p>
        <p><a href="https://colorohm.rsmk.me/">View Project →</a></p>

        <h3>Automatic Exhaust Fan – Smart Ventilation System</h3>
        <img src="/assets/smart-exhaust-gas-detection-system.webp" alt="Automatic Exhaust Fan Smart Ventilation Prototype with MQ-2 Gas Sensor — Srinivasa Manikanta" title="Automatic Exhaust Fan Arduino Prototype" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
        <p>An Arduino-based smart ventilation system using MQ-2 gas sensor for automatic exhaust fan control with relay switching, auto-off timer, and manual override.</p>
        <p><a href="https://autoexhaustfan.rsmk.co.in/">View Project →</a></p>

        <h3>SPDS – Solar Powered Dewatering System</h3>
        <img src="/assets/ai-chatbot-interface-background.webp" alt="SPDS Solar Powered Dewatering System for Irrigation — Srinivasa Manikanta" title="SPDS Solar Dewatering System" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
        <p>A PM-KUSUM aligned solar-powered dewatering system for solar irrigation in India, eliminating grid dependency for agricultural water pumping.</p>
        <p><a href="https://spds.rsmk.me/">View Project →</a></p>

        <h3>Single-Axis Solar Tracker – Comparator Controlled System</h3>
        <img src="/assets/single-axis-solar-tracker.png" alt="Single Axis Solar Tracker with Analog Comparator Circuit by Srinivasa Manikanta" title="Single Axis Solar Tracker" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
        <p>An LDR-based single axis solar tracker built with transistor comparator relay logic that maximizes solar panel efficiency by auto-aligning with sunlight (~30% yield gain).</p>

        <h3>GridForge – Smart Energy Management System</h3>
        <img src="/assets/gridforge/web-dashboard-interface.png" alt="GridForge Smart Grid Simulation Web Dashboard by Srinivasa Manikanta" title="GridForge Smart Grid System" width="400" height="250" loading="lazy" style="max-width:100%;height:auto;border-radius:8px;margin:8px 0;" />
